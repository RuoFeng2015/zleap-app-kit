name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: 包名、版本与随附 skills 一致
        run: npm run check
      - name: 单元与流程测试
        run: npm test
      - name: skills 能被 npx skills 发现
        if: matrix.os == 'ubuntu-latest'
        env:
          DISABLE_TELEMETRY: '1'
        run: npx -y skills@latest add . --list | tee /tmp/skills.txt && grep -q zleap-cloud-app-release /tmp/skills.txt
